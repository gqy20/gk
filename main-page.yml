          - paragraph [ref=e304]: 对于第一类考生，我校将根据笔试成绩，按招生组别的分省招生计划数的5倍确定各省入围复试考生名单并公布入围标准，同专业组末位同分考生均予以入围。未入围复试考生不参与后续选拔环节及综合成绩排序。考生可在报名系统内查询笔试成绩及入围情况。
