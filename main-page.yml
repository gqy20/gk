          - paragraph [ref=e416]:
            - generic [ref=e417]: 五、其他说明
          - paragraph [ref=e418]:
            - generic [ref=e419]: （一）强基计划录取考生入学后原则上不转专业。
          - paragraph [ref=e420]:
            - generic [ref=e421]: （二）学生综合素质档案由省级教育行政部门负责直接或汇总各中学报考学生综合素质档案后上传至报名系统。
          - paragraph [ref=e422]:
            - generic [ref=e424]: （三）对于综合素质档案造假或在高校考核中舞弊的考生，将取消其强基计划的报名、考试和录取资格，并将有关情况通报有关省级招生考试机构或教育行政部门。教育行政部门将按照有关规定给予相应处理。已经入学的，按教育部和我校相关规定处理取消学籍，毕业后发现的，则取消毕业证、学位证。中学应当对所出具的材料认真核实，出现弄虚作假情形的，我校保留采取相关措施的权利。
          - paragraph [ref=e425]:
            - generic [ref=e427]:
              - text: （四）
              - generic [ref=e428]: 凡参加强基计划校测复试的考生，须购买测试期间的个人“人身意外伤害保险”。
          - paragraph [ref=e429]:
            - generic [ref=e430]: （五）选拔测试期间，考生的交通、食宿等费用自理。
          - paragraph [ref=e431]:
            - generic [ref=e432]: （六）学校未委托任何个人或中介组织开展强基计划等考试招生有关工作，不举办任何形式的营利性培训活动。
          - paragraph [ref=e433]:
            - generic [ref=e434]: 六、监督保障机制
          - paragraph [ref=e435]:
            - generic [ref=e436]: （一）我校强基计划招生工作在浙江大学招生工作委员会的领导下，由浙江大学本科生招生办公室负责具体工作的组织和实施。我校在实施本简章的过程中做到招生方案公开、选拔方法公平、录取标准公示。
          - paragraph [ref=e437]:
            - generic [ref=e438]: （二）我校将对录取的学生进行入学资格复查，对不具备入学资格的学生，按教育部相关规定处理。
