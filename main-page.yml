          - paragraph [ref=e398]:
            - generic [ref=e399]: 四、培养特色
          - paragraph [ref=e400]:
            - generic [ref=e401]: 强基计划学生纳入竺可桢学院实施特别培养，强化使命驱动，厚植家国情怀，培育远大理想。采用“三制三化”（学分制、导师制、书院制和小班化、个性化、国际化）人才培养模式；实施阶段性考核和动态进出机制，对符合培养要求的学生实行本研衔接培养；为强基计划学生提供高质量国际化培养与全面科研训练，支持学生参与基础研究、前沿交叉研究和颠覆性技术攻关。
          - paragraph [ref=e402]:
            - generic [ref=e404]: 数学与应用数学专业含数学与应用数学、智能科学两个培养方向，其中数学与应用数学依托数学科学学院培养，智能科学方向依托计算机科学与技术学院和数学科学学院培养。
          - paragraph [ref=e405]:
            - generic [ref=e407]:
