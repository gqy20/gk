        - heading "学校简介" [level=2] [ref=e97]
      - generic [ref=e98]:
        - generic [ref=e99]:
          - paragraph [ref=e100]:
            - generic [ref=e101]: 河北工业大学的前身是创办于1903年的北洋工艺学堂，是我国最早的培养工业人才的高等学校之一，创办了全国最早的高校校办工厂。1929年改称河北省立工业学院，1995年更名为河北工业大学。学校1996年跻身国家首批“211工程”重点建设高校行列；2014年由河北省、天津市和教育部共建；2017年，入选国家“双一流”建设高校；2022年，入选新一轮国家“双一流”建设高校。12
            - text: 0余
            - generic [ref=e102]: 年来，学校始终秉承“兴工报国”办学传统和“勤慎公忠”校训精神，形成了“工学并举”的办学特色，为国家培养了30余万名优秀毕业生。
            - text: 近年来，材料科学、化学、工程学、环境与生态学、计算机科学、
            - generic [ref=e103]: 社会科学总论、物理学7
            - generic [ref=e104]: 个学科领域在ESI全球排名前1%中稳步提升
            - text: ，
            - generic [ref=e105]: 其中工程学进入前1‰
            - text: 。学校获评“全国文明校园”荣誉称号。
          - paragraph [ref=e106]:
            - generic [ref=e107]: 学校设有2
            - text: "1"
            - generic [ref=e108]: 个教学机构，现有6
            - text: 1个本科招生专业，
            - generic [ref=e109]: 其中37个国家级一流本科专业建设点，涵盖工、理、经、管、文、法、艺七大学科门类，
            - text: "21"
            - generic [ref=e110]: 个专业通过工程教育专业认证/住房
            - text: 和城乡建设部专业评估。
            - generic [ref=e111]: 拥有1个国家“双一流”学科、2个国家重点学科，7个河北省“双一流”学科，20个河北省重点学科，6个天津市顶尖学科和服务产业特色学科群，7个天津市重点学科。拥
            - generic [ref=e112]: 有10个博士后科研流动站、11个一级学科博士学位授权点
            - text: 、1个博士专业学位类别、27
            - generic [ref=e113]: 个一级学科硕士学位授权点、19个硕士专业学位类别。现有全日制本科在校生24000余人、研究生
            - text: 11000余人。
          - paragraph [ref=e114]:
            - generic [ref=e115]: 学校持续加强高水平教师队伍建设。近年来，全职引进和培养了一批国家级人才，3
            - text: 30余人具有国家级教学名师、全国模范教师、省级教学名师等省部级以上专家称号。现有教职员工2700余人，其中专任教师1800余人。
          - paragraph [ref=e116]:
            - generic [ref=e117]: 学校建有智能配用电装备与系统全国重点实验室、轧辊材料及复合成形全国重点实验室等国家和省部级科研平台72个，积极服务京津冀协同发展重大国家战略需要和区域产业转型升级发展需求。荣获国家自然科学二等奖、国家科技进步二等奖、“侯德榜化工科学技术成就奖”、高等学校科学研究优秀成果奖（人文社会科学）、河北省科技突出贡献奖等百余项省部级以上奖励。“十四五”以来，主持国家重大重点科研项目85项，在破解“卡脖子”技术难题和颠覆性技术创新上持续攻关；承担国家级科研项目755项，国家自然科学基金项目年度立项数量连续六年处于百项水平；签订横向合同3500多项，技术合同登记额稳居天津地区高校前三；累计签订千万级合同21项，服务国家和区域经济建设能力显著增强；年度申请专利数量超600件，获批国家首批知识产权试点高校；年度到校科研经费超6亿元。教师多次在《Nature》等国际顶级期刊发表论文，“元光号”小卫星搭乘长征八号运载火箭成功飞天并在轨运行，高性能机器人触觉传感智能系统入选2020年“科创中国”先导技术榜单，立面维护机器人入选2023中国智能制造十大科技进展和2023年“科创中国”先导技术榜单，光伏组件可靠性检测视觉大模型应用场景入选2024年京津冀共建共享十大场景。
          - paragraph [ref=e118]:
            - generic [ref=e119]: 学校注重国际交流合作，现已形成全方位、多层次、宽领域的国际合作办学新格局。目前，学校已与60余所国外高校签订了合作办学协议，合作培养覆盖本科到博士各层次。学校在芬兰与拉彭兰塔-拉赫蒂理工大学合作共建“河北工业大学芬兰校区”。学校现有在校中外合作办学项目学生700余人，留学生近500人。
          - paragraph [ref=e120]:
            - generic [ref=e121]: 当前，省市部共建为学校搭建新的发展平台，国家“双一流”建设让学校的发展迈进“新时代”，百廿工大踏上新征程。学校将始终坚持以习近平新时代中国特色社会主义思想为指导，坚持社会主义办学方向，全面贯彻党的教育方针，践行“四个服务”时代使命，落实立德树人根本任务，扎根中国大地，走高质量发展之路，努力建设成为国内外有重要影响、特色鲜明的高水平社会主义大学，为国家和区域经济社会发展提供人才支持和智力支撑，为人类文明进步作出贡献！
          - paragraph [ref=e122]
          - paragraph [ref=e123]:
            - generic [ref=e124]: （相关数据截至202
            - text: 5年12月）
          - paragraph [ref=e125]
        - generic [ref=e126]:
